services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    env_file:
      - ./gateway/.env.production
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
